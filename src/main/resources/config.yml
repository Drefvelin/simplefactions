# SimpleFactions — map-reference: main (world: TFMC_Map)
# world-name must match the loaded Bukkit overworld (server.properties level-name).

world-name: TFMC_Map

# When true, debug sessions are appended to plugins/SimpleFactions/logs/log.txt
# and relation events are appended to plugins/SimpleFactions/logs/relations.log
# Movement / civil war / war events go to movement.log, civilwar.log, war.log
logging: true
# When true, all files in plugins/SimpleFactions/logs/ are deleted on every plugin start/reload
wipe-log: true

max-prestige-from-wealth: 800 # shared between factions based on % of global wealth
max-members: 64
max-untitled-provinces: 5
max-free-titles: 3
province-cost: 50
dividend-require-previous-tick-membership: true

# Mercenary companies
mercenary-formation-cost: 100.0
mercenary-formation-seconds: 86400
mercenary-slot-upkeep: 8.0
# Contract floors. A company sets its own prices but may not go below these.
mercenary-min-price-per-battle: 50.0
mercenary-min-price-per-day: 10.0
mercenary-max-contract-days: 14
# Pre-filled into a new contract; the real figure lives on the contract itself.
mercenary-default-breach-refund: 500.0

bank-block: iaf(tfmc:bank)
voting-block: v(chiseled_bookshelf)
starting-year: "372 AE"

max-extra-node-capacity: 0
de-jure-requirement: 75.0

# Map platform (step 42) — requires TFMCWeb softdepend + api.base-url configured
enable-map: true
# When false, skip Input/ province grid load; land, war, and map systems are off.
# Also forces enable-map to false.
enable-provinces: true
# Daily wealth/prestige snapshot uploaded to ProvinceSystem for season graphs.
# Independent of enable-map so a broken chronicle never blocks a map regen.
enable-chronicle: true
map-reference: main
settlement-large-population-threshold: 8
port-sea-proximity-blocks: 20

battle:
  province_poll_interval_ticks: 20
  province_leave_countdown_seconds: 10
  province_block_protection_enabled: false
  capture_min_players: 1
  item_durability_multiplier: 0.2
  retreat_min_elapsed_seconds: 1200
  signup_reminder_seconds_before:
    - 1800
    - 600
    - 300
    - 60
  siege:
    contest_duration_seconds: 180
  raid:
    defender_respawn_mode_default: INFINITE
  campaign_template:
    field: field_default
    siege: siege_default
    raid: campaign_raid_template

branch-upgrade-cost: 100.0
branch-upgrade-exponent: 1.07

terrain-modifiers:
    - FARMLAND 0.95
    - PLAINS 0.85
    - HILLS 0.5
    - FOREST 0.6
    - HIGHLANDS 0.55
    - JUNGLE 0.45
    - WATER 0.75
    - SEA 0.6
    - BOG 0.4
    - MOUNTAIN 0.3
    - DRYLANDS 0.6

icons:
    - diplomacy(black_dye.5)
    - overlord(black_dye.3)
    - subject(black_dye.4)
    - integrated_subject(black_dye.4)
    - rival(black_dye.6)
    - tributary(black_dye.7)
    - suzerain(black_dye.8)
    - ally(black_dye.9)
    - war(black_dye.10)
    - friendly(black_dye.11)
    - neutral(black_dye.2)
    - unfriendly(black_dye.13)
    - hostile(black_dye.14)
    - march(black_dye.15)
    - installations(black_dye.15)
    - palatinate(black_dye.16)
    - mercantile(black_dye.17)
    - tier(black_dye.18)
    - titles(black_dye.19)
    - county(black_dye.20)
    - duchy(black_dye.21)
    - kingdom(black_dye.22)
    - empire(black_dye.23)
    - independence(black_dye.5)
    - usurp(black_dye.3)
    - stability(black_dye.2)
    - loans_given(black_dye.7)
    - loans_taken(black_dye.8)
    - guild_elevate(black_dye.4)
    - guild_loans(black_dye.17)
    - muster(black_dye.11)

base-effects:
  favoured_guilds:
    modifiers:
      - stability_influence(10)
    our_territory:
      - trade_power(20)
  repressed_guilds:
    modifiers:
      - stability_influence(-25)
    our_territory:
      - trade_power(-15)
  favoured_vassals:
    modifiers:
      - stability_influence(10)
      - tax_multiplier(-5)
    our_territory:
      - trade_power(15)
  repressed_vassals:
    modifiers:
      - stability_influence(-15)
      - tax_multiplier(5)
    our_territory:
      - trade_power(-10)
