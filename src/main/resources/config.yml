# SimpleFactions — dev server template (map-reference: dev, world: TFMC_Map)
# world-name must match the loaded Bukkit overworld (server.properties level-name).

world-name: TFMC_Map

max-prestige-from-wealth: 800 # shared between factions based on % of global wealth
max-members: 64
max-untitled-provinces: 5
max-free-titles: 3
province-cost: 50

bank-block: iaf(tfmc:bank)
voting-block: v(chiseled_bookshelf)
starting-year: "372 AE"

max-extra-node-capacity: 0
de-jure-requirement: 75.0

# Map platform (step 42) — requires TFMCWeb softdepend + api.base-url configured
enable-map: true
map-reference: dev
settlement-large-population-threshold: 8
port-sea-proximity-blocks: 20

war:
  require_declare_code: false
  declare_opinion_threshold: -50
  initiative_factor: 1.5
  port_sea_zoc_radius: 2
  goals:
    DE_JURE_ANNEX:
      max_battles: 4
    SUBJUGATE:
      max_battles: 4
    TRANSFER_SUBJECT:
      max_battles: 4
  declined_ally_stability_penalty: -30
  battle_cadence:
    first_battle_at_border: true
    provinces_between_battles: 1
  occupation:
    include_enemy_neighbors: true
  pathfinder:
    neutral_penalty: 8.0
    sea_pass_enabled: true
    # water_cost: 0  # 0 = derive from terrain-modifiers WATER via 1/carry
  battle_schedule:
    # All hours below are Europe/Paris (CET/CEST), not UTC.
    window_start_hour: 20
    window_end_hour: 24
    vote_close_hour: 16
    defender_choice_deadline_hour: 12
    one_battle_per_day: true
    first_battle_day_after_declare: true
  battle_voting:
    min_players: 4
    require_smallest_side_full: true
    pass_if_either: true
    dev_min_players: 1
  battle_military:
    lives_per_regiment: 5
    min_side_lives: 1

battle:
  province_poll_interval_ticks: 20
  province_leave_countdown_seconds: 10
  capture_min_players: 1
  devmode:
    phantom_count: 10
  siege:
    contest_duration_seconds: 180
  raid:
    defender_respawn_mode_default: INFINITE
  campaign_template:
    field: field_default
    siege: siege_default
    raid: raid_template

# installation slots reserved for future VehicleFramework integration
installations:
  fort:
    daily-upkeep: 50
    construction-time: 10  # 432000 (5 days)
    slots:
      static_emplacement: 8
  port:
    daily-upkeep: 20
    construction-time: 10  # 259200 (3 days)
    slots:
      ship: 10
  airport:
    daily-upkeep: 35
    construction-time: 10  # 259200 (3 days)
    slots:
      aircraft: 10

branch-upgrade-cost: 100.0
branch-upgrade-exponent: 1.07

terrain-modifiers:
    - FARMLAND 0.95
    - PLAINS 0.85
    - HILLS 0.5
    - FOREST 0.6
    - HIGHLANDS 0.55
    - JUNGLE 0.45
    - WATER 0.75
    - SEA 0.6
    - BOG 0.4
    - MOUNTAIN 0.3
    - DRYLANDS 0.6

icons:
    - diplomacy(black_dye.5)
    - overlord(black_dye.3)
    - subject(black_dye.4)
    - integrated_subject(black_dye.4)
    - rival(black_dye.6)
    - tributary(black_dye.7)
    - suzerain(black_dye.8)
    - ally(black_dye.9)
    - war(black_dye.10)
    - friendly(black_dye.11)
    - neutral(black_dye.2)
    - unfriendly(black_dye.13)
    - hostile(black_dye.14)
    - march(black_dye.15)
    - installations(black_dye.15)
    - palatinate(black_dye.16)
    - mercantile(black_dye.17)
    - tier(black_dye.18)
    - titles(black_dye.19)
    - county(black_dye.20)
    - duchy(black_dye.21)
    - kingdom(black_dye.22)
    - empire(black_dye.23)
    - independence(black_dye.5)
    - usurp(black_dye.3)
    - stability(black_dye.2)
    - loans_given(black_dye.7)
    - loans_taken(black_dye.8)
    - guild_elevate(black_dye.4)
    - guild_loans(black_dye.17)
    - muster(black_dye.11)

base-effects:
  favoured_guilds:
    modifiers:
      - stability_influence(10)
    our_territory:
      - trade_power(20)
  repressed_guilds:
    modifiers:
      - stability_influence(-25)
    our_territory:
      - trade_power(-15)
  favoured_vassals:
    modifiers:
      - stability_influence(10)
      - tax_multiplier(-5)
    our_territory:
      - trade_power(15)
  repressed_vassals:
    modifiers:
      - stability_influence(-15)
      - tax_multiplier(5)
    our_territory:
      - trade_power(-10)
